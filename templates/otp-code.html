<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Tasdiqlash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 50px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .email-display {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
            color: #666;
        }

        .email-display strong {
            color: #333;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .otp-input-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .otp-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        .otp-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .otp-input.filled {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .otp-input-alt {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 18px;
            letter-spacing: 5px;
            transition: border-color 0.3s;
        }

        .otp-input-alt:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-type-toggle {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
            font-weight: 600;
        }

        .toggle-btn:hover {
            color: #764ba2;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .timer {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }

        .timer.expired {
            color: #e74c3c;
            font-weight: 600;
        }

        .resend-link {
            text-align: center;
            margin-top: 20px;
        }

        .resend-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .resend-link a:hover {
            text-decoration: underline;
        }

        .resend-link a.disabled {
            color: #999;
            cursor: not-allowed;
            text-decoration: none;
        }

        .info-text {
            color: #666;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            line-height: 1.6;
        }

        .hide {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🔐 OTP Tasdiqlash</h1>
            <p>Tasdiqlash kodini kiriting</p>
        </div>

        <div class="email-display">
            Kod yuborildi: <strong id="emailDisplay">---</strong>
        </div>

        <form id="otpForm">
            <div class="form-group">
                <label>Tasdiqlash Kodi</label>

                <div id="otpInputs" class="otp-input-container">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
                    <input class="otp-input" type="text" maxlength="1" inputmode="numeric">
                </div>

                <!-- Alternative single input -->
                <div id="otpInputAlt" class="hide">
                    <input
                        type="text"
                        id="otpCode"
                        class="otp-input-alt"
                        placeholder="000000"
                        maxlength="6"
                        inputmode="numeric"
                    >
                </div>

                <div class="input-type-toggle">
                    <button type="button" class="toggle-btn" id="toggleBtn">
                        Bitta maydon shaklida kiriting
                    </button>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Tasdiqlash</button>
        </form>

        <button type="button" class="btn btn-secondary" id="backBtn">← Orqaga</button>

        <div class="message" id="message"></div>

        <div class="timer" id="timer">
            Kodning amal qilish muddati: <span id="timeLeft">10:00</span>
        </div>

        <div class="resend-link">
            <a id="resendLink" class="disabled">Kodni qayta yuborish</a>
        </div>

    </div>

</body>
</html>
